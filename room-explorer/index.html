<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Room Explorer — کمرے میں کیا ہے؟</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#0f0a1e;color:white;overflow:hidden;height:100vh;width:100vw;user-select:none}
#app{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.u{font-family:'Noto Nastaliq Urdu',serif;direction:rtl;line-height:2}

/* ── Backgrounds ── */
.bg-home{background:linear-gradient(135deg,#1e1b4b 0%,#312e81 40%,#4c1d95 100%)}
.bg-bedroom{background:linear-gradient(135deg,#1e1b4b,#312e81)}
.bg-food{background:linear-gradient(135deg,#451a03,#78350f)}
.bg-outside{background:linear-gradient(135deg,#0c4a6e,#0369a1)}
.bg-animals{background:linear-gradient(135deg,#064e3b,#047857)}

/* ── Top bar ── */
.top-bar{position:absolute;top:0;left:0;right:0;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;z-index:10}
.top-bar .back{background:rgba(255,255,255,0.15);border:none;color:white;font-size:1.1em;padding:8px 16px;cursor:pointer;font-family:inherit;font-weight:600;transition:background 0.2s}
.top-bar .back:hover{background:rgba(255,255,255,0.25)}
.top-bar .info{text-align:right}
.top-bar .phase-label{font-size:0.75em;text-transform:uppercase;letter-spacing:0.1em;opacity:0.7}
.top-bar .room-name{font-size:1.1em;font-weight:700}
.progress-bar{position:absolute;top:0;left:0;right:0;height:4px;background:rgba(255,255,255,0.1)}
.progress-fill{height:100%;background:#34d399;transition:width 0.4s ease}

/* ── Home screen ── */
.home-title{text-align:center;margin-bottom:40px;animation:fadeSlideUp 0.6s ease}
.home-title h1{font-size:2.8em;font-weight:800;margin-bottom:4px}
.home-title .urdu-title{font-size:2em;opacity:0.85}
.home-title p{opacity:0.6;font-size:1em;margin-top:8px}
.room-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:600px;width:90%}
.room-card{background:rgba(255,255,255,0.08);border:2px solid rgba(255,255,255,0.15);padding:28px 24px;cursor:pointer;text-align:center;transition:all 0.25s;position:relative;overflow:hidden}
.room-card:hover{background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.3);transform:translateY(-4px)}
.room-card .room-icon{font-size:2.4em;margin-bottom:8px;display:block}
.room-card h3{font-size:1.2em;font-weight:700;margin-bottom:2px}
.room-card .room-urdu{font-size:1.3em;opacity:0.8}
.room-card .obj-count{font-size:0.75em;opacity:0.5;margin-top:6px}
.room-card.done::after{content:'';position:absolute;top:10px;right:10px;width:24px;height:24px;background:#34d399;display:flex;align-items:center;justify-content:center}
.room-card.done::before{content:'';position:absolute;top:16px;right:14px;width:12px;height:7px;border-left:3px solid white;border-bottom:3px solid white;transform:rotate(-45deg);z-index:1}

/* ── Object cards ── */
.card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;max-width:700px;width:90%;margin-top:20px}
.obj-card{background:rgba(255,255,255,0.06);border:2px solid rgba(255,255,255,0.12);padding:16px;text-align:center;cursor:pointer;transition:all 0.3s;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:160px;position:relative}
.obj-card:hover{background:rgba(255,255,255,0.12);border-color:rgba(255,255,255,0.25)}
.obj-card svg{width:90px;height:90px;margin-bottom:8px;transition:transform 0.3s}
.obj-card:hover svg{transform:scale(1.05)}
.obj-card .card-name{font-size:1.5em;font-weight:700;opacity:0;transition:opacity 0.4s;min-height:1.8em}
.obj-card .card-roman{font-size:0.7em;opacity:0;transition:opacity 0.4s;color:rgba(255,255,255,0.5)}
.obj-card .card-eng{font-size:0.65em;opacity:0;transition:opacity 0.4s;color:rgba(255,255,255,0.4)}
.obj-card.revealed .card-name,.obj-card.revealed .card-roman,.obj-card.revealed .card-eng{opacity:1}
.obj-card.hidden-obj svg{opacity:0.25;filter:grayscale(1)}
.obj-card.hidden-obj .card-name{opacity:0!important}
.obj-card.correct{border-color:#34d399;background:rgba(52,211,153,0.15);animation:bounceCard 0.5s ease}
.obj-card.wrong{animation:shakeCard 0.4s ease}
.obj-card.highlight{border-color:#fbbf24;background:rgba(251,191,36,0.12);box-shadow:0 0 30px rgba(251,191,36,0.2)}

/* ── Quiz choices ── */
.quiz-area{text-align:center;margin-top:20px}
.quiz-prompt{font-size:1.8em;font-weight:700;margin-bottom:20px;opacity:0.9}
.quiz-object{margin:10px auto 20px;width:140px;height:140px;background:rgba(255,255,255,0.08);border:2px solid rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;padding:15px}
.quiz-object svg{width:110px;height:110px}
.choices{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;max-width:700px;margin:0 auto}
.choice-btn{background:rgba(255,255,255,0.08);border:2px solid rgba(255,255,255,0.2);color:white;font-size:1.8em;font-weight:700;padding:14px 32px;cursor:pointer;transition:all 0.2s;min-width:160px;font-family:'Noto Nastaliq Urdu',serif;direction:rtl;line-height:2}
.choice-btn:hover{background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.35)}
.choice-btn.correct{background:rgba(52,211,153,0.2);border-color:#34d399;animation:bounceCard 0.4s ease}
.choice-btn.wrong{background:rgba(239,68,68,0.2);border-color:#ef4444;animation:shakeCard 0.4s ease}
.choice-btn:disabled{cursor:default;pointer-events:none}

/* ── Find mode ── */
.find-word{font-size:2.8em;font-weight:700;text-align:center;margin-bottom:10px}
.find-hint{text-align:center;opacity:0.4;font-size:0.85em;margin-bottom:15px}

/* ── Results ── */
.results{text-align:center;animation:fadeSlideUp 0.5s ease}
.results h2{font-size:2.2em;font-weight:800;margin-bottom:10px}
.results .stars{font-size:3em;margin:15px 0;letter-spacing:8px}
.results .star{display:inline-block;width:50px;height:50px;margin:0 6px;transition:all 0.4s ease}
.results .star.earned{animation:starPop 0.5s ease}
.results .score-text{font-size:1.1em;opacity:0.7;margin-bottom:25px}
.results-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:500px;margin:0 auto 25px}
.results-obj{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);padding:10px;text-align:center}
.results-obj svg{width:50px;height:50px}
.results-obj .ro-name{font-size:1em;font-weight:600}
.btn-row{display:flex;gap:12px;justify-content:center}
.btn{background:rgba(255,255,255,0.12);border:2px solid rgba(255,255,255,0.2);color:white;font-family:inherit;font-size:1em;font-weight:600;padding:12px 28px;cursor:pointer;transition:all 0.2s}
.btn:hover{background:rgba(255,255,255,0.2);border-color:rgba(255,255,255,0.35)}
.btn.primary{background:#059669;border-color:#059669}
.btn.primary:hover{background:#047857}

/* ── Ready button ── */
.ready-area{text-align:center;margin-top:20px;animation:fadeSlideUp 0.4s ease}

/* ── Particles ── */
#particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:100}
.particle{position:absolute;width:8px;height:8px;animation:particleFall 1s ease-out forwards}

/* ── Animations ── */
@keyframes fadeSlideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounceCard{0%{transform:scale(1)}30%{transform:scale(1.08)}60%{transform:scale(0.97)}100%{transform:scale(1)}}
@keyframes shakeCard{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes starPop{0%{transform:scale(0) rotate(-30deg);opacity:0}60%{transform:scale(1.3) rotate(10deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes particleFall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(120px) rotate(360deg)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(52,211,153,0.4)}50%{box-shadow:0 0 20px 8px rgba(52,211,153,0.2)}}
.stagger-1{animation-delay:0.05s}.stagger-2{animation-delay:0.1s}.stagger-3{animation-delay:0.15s}.stagger-4{animation-delay:0.2s}.stagger-5{animation-delay:0.25s}.stagger-6{animation-delay:0.3s}
.fade-in{animation:fadeSlideUp 0.4s ease both}
</style>
</head>
<body>
<div id="app" class="bg-home"></div>
<div id="particles"></div>

let actx;
function ensureAudio(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)()}
function tone(f,d,t,v=0.3){ensureAudio();const o=actx.createOscillator(),g=actx.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.setValueAtTime(v,actx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d)}
function sfxPop(){tone(600,0.1,'sine',0.2);tone(900,0.08,'sine',0.15)}
function sfxCorrect(){tone(523,0.15,'sine');setTimeout(()=>tone(659,0.15,'sine'),100);setTimeout(()=>tone(784,0.2,'sine'),200)}
function sfxWrong(){tone(200,0.2,'triangle',0.2);tone(180,0.3,'triangle',0.15)}
function sfxCelebrate(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,0.25,'sine',0.2),i*120))}

// ═══════════════════ STATE ═══════════════════
const app=document.getElementById('app');
const particles=document.getElementById('particles');
let state='home';
let room=null;
let explored=new Set();
let qIndex=0;
let qOrder=[];
let score=0;
let attempts=0;
let completed=new Set();

// ═══════════════════ HELPERS ═══════════════════
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

function getChoices(correct,pool,n=3){
    const others=pool.filter(o=>o.id!==correct.id);
    const picked=shuffle(others).slice(0,n-1);
    picked.push(correct);
    return shuffle(picked);
}

function spawnParticles(x,y,count=12){
    const colors=['#34d399','#fbbf24','#60a5fa','#f472b6','#a78bfa'];
    for(let i=0;i<count;i++){
        const p=document.createElement('div');
        p.className='particle';
        p.style.left=(x+Math.random()*40-20)+'px';
        p.style.top=(y+Math.random()*20-10)+'px';
        p.style.background=colors[Math.floor(Math.random()*colors.length)];
        p.style.width=(5+Math.random()*6)+'px';
        p.style.height=p.style.width;
        p.style.animationDuration=(0.6+Math.random()*0.6)+'s';
        particles.appendChild(p);
        setTimeout(()=>p.remove(),1200);
    }
}

function starSVG(earned){
    const fill=earned?'#FBBF24':'rgba(255,255,255,0.1)';
    const stroke=earned?'#F59E0B':'rgba(255,255,255,0.15)';
    return `<svg viewBox="0 0 50 50" class="star ${earned?'earned':''}"><polygon points="25,4 30,18 45,18 33,27 37,42 25,33 13,42 17,27 5,18 20,18" fill="${fill}" stroke="${stroke}" stroke-width="1.5"/></svg>`;
}

// ═══════════════════ RENDER ═══════════════════
function render(){
    switch(state){
        case 'home': renderHome(); break;
        case 'explore': renderExplore(); break;
        case 'quiz': renderQuiz(); break;
        case 'find': renderFind(); break;
        case 'results': renderResults(); break;
    }
}

function renderHome(){
    app.className='bg-home';
    app.innerHTML=`
        <div class="home-title">
            <h1>Room Explorer</h1>
            <div class="urdu-title u">کمرے میں کیا ہے؟</div>
            <p>Pick a room to explore</p>
        </div>
        <div class="room-grid">
            ${ROOMS.map((r,i)=>`
                <div class="room-card ${completed.has(r.id)?'done':''} fade-in stagger-${i+1}" onclick="startRoom('${r.id}')">
                    <span class="room-icon">${r.icon}</span>
                    <h3>${r.name}</h3>
                    <div class="room-urdu u">${r.urdu}</div>
                    <div class="obj-count">${r.objects.length} objects</div>
                </div>
            `).join('')}
        </div>
        <div style="margin-top:24px;opacity:0.35;font-size:0.8em;text-align:center">
            <a href="/" style="color:white;text-decoration:none">Home</a>
        </div>
    `;
}

function renderExplore(){
    app.className=room.bg;
    const allRevealed=explored.size>=room.objects.length;
    app.innerHTML=`
        <div class="progress-bar"><div class="progress-fill" style="width:${(explored.size/room.objects.length)*33}%"></div></div>
        <div class="top-bar">
            <button class="back" onclick="goHome()">Back</button>
            <div class="info">
                <div class="phase-label">Explore</div>
                <div class="room-name">${room.name} · <span class="u">${room.urdu}</span></div>
            </div>
        </div>
        <div style="text-align:center;margin-top:60px;margin-bottom:0">
            <div style="font-size:1.5em;font-weight:700;opacity:0.9" class="fade-in">Click each object to learn its name</div>
        </div>
        <div class="card-grid">
            ${room.objects.map((obj,i)=>`
                <div class="obj-card ${explored.has(obj.id)?'revealed':''} fade-in stagger-${i+1}" onclick="exploreClick('${obj.id}')">
                    ${S[obj.id]}
                    <div class="card-name u">${obj.urdu}</div>
                    <div class="card-roman">${obj.roman}</div>
                    <div class="card-eng">${obj.eng}</div>
                </div>
            `).join('')}
        </div>
        ${allRevealed?`
            <div class="ready-area">
                <button class="btn primary" onclick="startQuiz()" style="font-size:1.2em;padding:14px 40px">Ready? Let's play!</button>
            </div>
        `:''}
    `;
}

function renderQuiz(){
    app.className=room.bg;
    const obj=room.objects[qOrder[qIndex]];
    const choices=getChoices(obj,room.objects,3);
    const progress=33+(qIndex/room.objects.length)*33;
    app.innerHTML=`
        <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
        <div class="top-bar">
            <button class="back" onclick="goHome()">Back</button>
            <div class="info">
                <div class="phase-label">Quiz · ${qIndex+1}/${room.objects.length}</div>
                <div class="room-name u" style="font-size:1.3em">یہ کیا ہے؟</div>
            </div>
        </div>
        <div class="quiz-area" style="margin-top:70px">
            <div class="quiz-object fade-in">${S[obj.id]}</div>
            <div class="choices">
                ${choices.map(c=>`
                    <button class="choice-btn" data-id="${c.id}" onclick="quizAnswer(this,'${c.id}','${obj.id}')">${c.urdu}</button>
                `).join('')}
            </div>
        </div>
    `;
}

function renderFind(){
    app.className=room.bg;
    const obj=room.objects[qOrder[qIndex]];
    const progress=66+(qIndex/room.objects.length)*34;
    app.innerHTML=`
        <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
        <div class="top-bar">
            <button class="back" onclick="goHome()">Back</button>
            <div class="info">
                <div class="phase-label">Find · ${qIndex+1}/${room.objects.length}</div>
                <div class="room-name">Find the object</div>
            </div>
        </div>
        <div style="margin-top:70px;text-align:center">
            <div class="find-word u fade-in">${obj.urdu}</div>
            <div class="find-hint">${obj.roman} — ${obj.eng}</div>
        </div>
        <div class="card-grid">
            ${shuffle(room.objects).map((o,i)=>`
                <div class="obj-card fade-in stagger-${i+1}" data-id="${o.id}" onclick="findAnswer(this,'${o.id}','${obj.id}')">
                    ${S[o.id]}
                </div>
            `).join('')}
        </div>
    `;
}

function renderResults(){
    app.className=room.bg;
    const maxScore=room.objects.length*2;
    const pct=score/maxScore;
    const stars3=pct>=0.85;
    const stars2=pct>=0.6;
    app.innerHTML=`
        <div class="results">
            <h2>Room Complete!</h2>
            <div class="stars">
                ${starSVG(true)}
                ${starSVG(stars2)}
                ${starSVG(stars3)}
            </div>
            <div class="score-text">${Math.round(score)}/${maxScore} points</div>
            <div class="results-grid">
                ${room.objects.map(o=>`
                    <div class="results-obj fade-in">
                        ${S[o.id]}
                        <div class="ro-name u">${o.urdu}</div>
                    </div>
                `).join('')}
            </div>
            <div class="btn-row">
                <button class="btn" onclick="goHome()">All Rooms</button>
                <button class="btn primary" onclick="replayRoom()">Play Again</button>
            </div>
        </div>
    `;
    setTimeout(()=>sfxCelebrate(),300);
}

// ═══════════════════ GAME LOGIC ═══════════════════
function goHome(){
    state='home';
    render();
}

function startRoom(id){
    room=ROOMS.find(r=>r.id===id);
    explored.clear();
    qIndex=0;
    score=0;
    attempts=0;
    state='explore';
    sfxPop();
    render();
}

function exploreClick(id){
    if(explored.has(id))return;
    explored.add(id);
    sfxPop();
    const card=document.querySelector(`.obj-card[onclick*="${id}"]`);
    if(card){
        card.classList.add('revealed');
        card.style.animation='bounceCard 0.4s ease';
    }
    if(explored.size>=room.objects.length){
        setTimeout(()=>render(),400);
    }
}

function startQuiz(){
    state='quiz';
    qIndex=0;
    qOrder=shuffle([...Array(room.objects.length).keys()]);
    attempts=0;
    sfxPop();
    render();
}

function quizAnswer(btn,clickedId,correctId){
    if(btn.classList.contains('correct')||btn.classList.contains('wrong'))return;
    if(clickedId===correctId){
        btn.classList.add('correct');
        if(attempts===0) score+=1; else score+=0.5;
        attempts=0;
        sfxCorrect();
        const rect=btn.getBoundingClientRect();
        spawnParticles(rect.left+rect.width/2,rect.top);
        document.querySelectorAll('.choice-btn').forEach(b=>b.disabled=true);
        setTimeout(()=>{
            qIndex++;
            if(qIndex>=room.objects.length){
                state='find';
                qIndex=0;
                qOrder=shuffle([...Array(room.objects.length).keys()]);
                attempts=0;
            }
            render();
        },1000);
    } else {
        btn.classList.add('wrong');
        attempts++;
        sfxWrong();
        setTimeout(()=>{btn.classList.remove('wrong');btn.style.opacity='0.3';btn.disabled=true},400);
    }
}

function findAnswer(card,clickedId,correctId){
    if(card.classList.contains('correct'))return;
    if(clickedId===correctId){
        card.classList.add('correct');
        if(attempts===0) score+=1; else score+=0.5;
        attempts=0;
        sfxCorrect();
        const rect=card.getBoundingClientRect();
        spawnParticles(rect.left+rect.width/2,rect.top);
        document.querySelectorAll('.obj-card').forEach(c=>c.style.pointerEvents='none');
        setTimeout(()=>{
            qIndex++;
            if(qIndex>=room.objects.length){
                completed.add(room.id);
                state='results';
            }
            render();
        },1000);
    } else {
        card.classList.add('wrong');
        attempts++;
        sfxWrong();
        setTimeout(()=>card.classList.remove('wrong'),400);
    }
}

function replayRoom(){
    startRoom(room.id);
}

// ═══════════════════ INIT ═══════════════════
render();
</script>
