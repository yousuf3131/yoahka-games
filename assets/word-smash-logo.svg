<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="g2" x1="100" y1="100" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="400" rx="40" fill="#0a0f1a"/>
  <!-- Stars -->
  <circle cx="50" cy="40" r="2" fill="#fff" opacity="0.6"/>
  <circle cx="120" cy="25" r="1.5" fill="#fff" opacity="0.4"/>
  <circle cx="300" cy="50" r="2" fill="#fff" opacity="0.5"/>
  <circle cx="350" cy="30" r="1" fill="#fff" opacity="0.3"/>
  <circle cx="80" cy="80" r="1" fill="#fff" opacity="0.5"/>
  <circle cx="320" cy="90" r="1.5" fill="#fff" opacity="0.4"/>
  <!-- Ground line -->
  <line x1="40" y1="310" x2="360" y2="310" stroke="#1e293b" stroke-width="2"/>
  <!-- Block 1 (green, correct) -->
  <g transform="translate(80, 160)">
    <rect width="80" height="80" rx="8" fill="url(#g1)" stroke="#a7f3d0" stroke-width="2"/>
    <rect x="8" y="8" width="64" height="64" rx="4" fill="#000" opacity="0.3"/>
    <text x="40" y="52" text-anchor="middle" font-family="serif" font-size="36" font-weight="bold" fill="#fff" direction="rtl">کھا</text>
  </g>
  <!-- Block 2 (blue) -->
  <g transform="translate(170, 180)">
    <rect width="70" height="70" rx="8" fill="#2563eb" opacity="0.7"/>
    <rect x="7" y="7" width="56" height="56" rx="4" fill="#000" opacity="0.3"/>
    <text x="35" y="46" text-anchor="middle" font-family="serif" font-size="30" font-weight="bold" fill="#fff" direction="rtl">پی</text>
  </g>
  <!-- Block 3 (orange) -->
  <g transform="translate(250, 170)">
    <rect width="75" height="75" rx="8" fill="url(#g2)" opacity="0.8"/>
    <rect x="7" y="7" width="61" height="61" rx="4" fill="#000" opacity="0.3"/>
    <text x="38" y="48" text-anchor="middle" font-family="serif" font-size="32" font-weight="bold" fill="#fff" direction="rtl">جا</text>
  </g>
  <!-- Smash particles -->
  <circle cx="120" cy="140" r="6" fill="#34d399" opacity="0.8"/>
  <circle cx="100" cy="130" r="4" fill="#34d399" opacity="0.6"/>
  <circle cx="140" cy="135" r="5" fill="#a7f3d0" opacity="0.7"/>
  <circle cx="105" cy="150" r="3" fill="#34d399" opacity="0.5"/>
  <circle cx="135" cy="148" r="4" fill="#6ee7b7" opacity="0.6"/>
  <!-- Prompt text -->
  <text x="200" y="115" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#f59e0b" letter-spacing="2">SMASH:</text>
  <text x="200" y="140" text-anchor="middle" font-family="Inter, sans-serif" font-size="22" font-weight="800" fill="#34d399">"to eat"</text>
  <!-- Pedestals -->
  <ellipse cx="120" cy="310" rx="45" ry="8" fill="#1e293b"/>
  <ellipse cx="205" cy="310" rx="40" ry="8" fill="#1e293b"/>
  <ellipse cx="287" cy="310" rx="42" ry="8" fill="#1e293b"/>
  <!-- Title -->
  <text x="200" y="365" text-anchor="middle" font-family="Inter, sans-serif" font-size="28" font-weight="900" fill="#34d399" letter-spacing="3">WORD SMASH</text>
</svg>
