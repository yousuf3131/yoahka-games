<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e0a16"/><stop offset="1" stop-color="#1a1028"/></linearGradient>
    <linearGradient id="pfloor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2232"/><stop offset="1" stop-color="#1a1424"/></linearGradient>
    <linearGradient id="pwall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e1628"/><stop offset="1" stop-color="#14101e"/></linearGradient>
    <radialGradient id="plight1" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0.15"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <radialGradient id="plight2" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#f2c14e" stop-opacity="0.12"/><stop offset="1" stop-color="#f2c14e" stop-opacity="0"/></radialGradient>
    <radialGradient id="pflash" cx="0.5" cy="0" r="1"><stop offset="0" stop-color="#fde68a" stop-opacity="0.35"/><stop offset="0.4" stop-color="#fde68a" stop-opacity="0.08"/><stop offset="1" stop-color="#fde68a" stop-opacity="0"/></radialGradient>
    <filter id="pglow"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="psoft"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="psglow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- Background -->
  <rect width="660" height="300" fill="url(#pbg)"/>
  <!-- Back wall -->
  <rect x="0" y="0" width="660" height="160" fill="url(#pwall)"/>
  <!-- Wall line -->
  <line x1="0" y1="160" x2="660" y2="160" stroke="#3a2a48" stroke-width="2"/>
  <!-- Floor -->
  <rect x="0" y="160" width="660" height="140" fill="url(#pfloor)"/>
  <!-- Floor grid lines (perspective) -->
  <g stroke="#2a1e38" stroke-width="0.8" opacity="0.4">
    <line x1="0" y1="190" x2="660" y2="190"/><line x1="0" y1="220" x2="660" y2="220"/>
    <line x1="0" y1="250" x2="660" y2="250"/><line x1="0" y1="280" x2="660" y2="280"/>
  </g>
  <!-- Ambient light pools -->
  <ellipse cx="160" cy="200" rx="100" ry="60" fill="url(#plight1)"/>
  <ellipse cx="500" cy="220" rx="90" ry="50" fill="url(#plight2)"/>
  <!-- Shelf on back wall (left) -->
  <rect x="50" y="80" width="120" height="8" rx="2" fill="#3a2a18"/>
  <rect x="50" y="115" width="120" height="8" rx="2" fill="#3a2a18"/>
  <rect x="50" y="80" width="6" height="43" fill="#3a2a18"/>
  <rect x="164" y="80" width="6" height="43" fill="#3a2a18"/>
  <!-- Items on shelf -->
  <rect x="60" y="68" width="14" height="12" rx="1" fill="#6b5a3a"/>
  <rect x="80" y="72" width="10" height="8" rx="1" fill="#5a4a30"/>
  <rect x="100" y="65" width="16" height="15" rx="1" fill="#7a6a4a"/>
  <rect x="130" y="70" width="12" height="10" rx="1" fill="#5a4a30"/>
  <rect x="60" y="103" width="12" height="12" rx="1" fill="#6b5a3a"/>
  <rect x="85" y="100" width="18" height="15" rx="1" fill="#7a6a4a"/>
  <rect x="140" y="105" width="14" height="10" rx="1" fill="#5a4a30"/>
  <!-- Table (center-left) -->
  <rect x="180" y="190" width="80" height="5" rx="1" fill="#5a4228"/>
  <rect x="185" y="195" width="4" height="35" fill="#4a3620"/>
  <rect x="252" y="195" width="4" height="35" fill="#4a3620"/>
  <!-- Real barrel (back left) -->
  <g transform="translate(90 140)">
    <ellipse cx="0" cy="20" rx="16" ry="3" fill="#000" opacity="0.2" filter="url(#psoft)"/>
    <rect x="-15" y="-18" width="30" height="36" rx="6" fill="#6b4a2a"/>
    <rect x="-15" y="-14" width="30" height="4" rx="1" fill="#5a3a1a"/>
    <rect x="-15" y="8" width="30" height="4" rx="1" fill="#5a3a1a"/>
    <ellipse cx="0" cy="-18" rx="15" ry="5" fill="#7a5a3a"/>
    <line x1="-10" y1="-18" x2="-10" y2="18" stroke="#8a6a4a" stroke-width="0.5" opacity="0.4"/>
    <line x1="10" y1="-18" x2="10" y2="18" stroke="#8a6a4a" stroke-width="0.5" opacity="0.4"/>
  </g>
  <!-- Suspicious barrel (center) - this is a PLAYER hiding -->
  <g transform="translate(330 195)">
    <ellipse cx="0" cy="22" rx="18" ry="3.5" fill="#000" opacity="0.25" filter="url(#psoft)"/>
    <rect x="-16" y="-20" width="32" height="40" rx="7" fill="#7a5a3a"/>
    <rect x="-16" y="-15" width="32" height="4" rx="1" fill="#6a4a2a"/>
    <rect x="-16" y="9" width="32" height="4" rx="1" fill="#6a4a2a"/>
    <ellipse cx="0" cy="-20" rx="16" ry="5.5" fill="#8a6a4a"/>
    <line x1="-11" y1="-20" x2="-11" y2="20" stroke="#9a7a5a" stroke-width="0.5" opacity="0.4"/>
    <line x1="11" y1="-20" x2="11" y2="20" stroke="#9a7a5a" stroke-width="0.5" opacity="0.4"/>
    <!-- Sneaky eyes peeking from the barrel -->
    <ellipse cx="-5" cy="-6" rx="3.5" ry="4" fill="#1a1008"/>
    <ellipse cx="7" cy="-6" rx="3.5" ry="4" fill="#1a1008"/>
    <circle cx="-4" cy="-6" r="2" fill="#22c55e"/>
    <circle cx="8" cy="-6" r="2" fill="#22c55e"/>
    <circle cx="-3.5" cy="-6.5" r="0.8" fill="#fff"/>
    <circle cx="8.5" cy="-6.5" r="0.8" fill="#fff"/>
    <!-- Question mark above -->
    <text x="0" y="-38" text-anchor="middle" font-size="22" font-weight="900" fill="#f2c14e" font-family="Arial,sans-serif" opacity="0.8" filter="url(#psglow)">?</text>
  </g>
  <!-- Real crate (right) -->
  <g transform="translate(520 195)">
    <ellipse cx="0" cy="22" rx="18" ry="3" fill="#000" opacity="0.15" filter="url(#psoft)"/>
    <rect x="-18" y="-18" width="36" height="38" rx="3" fill="#6b5a3a"/>
    <line x1="-18" y1="0" x2="18" y2="0" stroke="#5a4a2a" stroke-width="1.5"/>
    <line x1="0" y1="-18" x2="0" y2="20" stroke="#5a4a2a" stroke-width="1.5"/>
    <rect x="-5" y="-5" width="10" height="10" rx="1" fill="none" stroke="#8a7a5a" stroke-width="1"/>
  </g>
  <!-- Real chair (back right) -->
  <g transform="translate(440 155)">
    <rect x="-12" y="0" width="24" height="3" rx="1" fill="#5a4228"/>
    <rect x="-12" y="-20" width="3" height="20" fill="#4a3620"/>
    <rect x="9" y="-20" width="3" height="20" fill="#4a3620"/>
    <rect x="-12" y="3" width="3" height="16" fill="#4a3620"/>
    <rect x="9" y="3" width="3" height="16" fill="#4a3620"/>
    <rect x="-12" y="-24" width="24" height="6" rx="1" fill="#5a4228"/>
  </g>
  <!-- Seeker player (right side, with flashlight) -->
  <g transform="translate(560 170)">
    <ellipse cx="0" cy="55" rx="18" ry="4" fill="#000" opacity="0.2" filter="url(#psoft)"/>
    <!-- Legs -->
    <line x1="-7" y1="35" x2="-12" y2="54" stroke="#4338ca" stroke-width="8" stroke-linecap="round"/>
    <line x1="7" y1="33" x2="14" y2="52" stroke="#4338ca" stroke-width="8" stroke-linecap="round"/>
    <!-- Body -->
    <rect x="-13" y="8" width="26" height="28" rx="5" fill="#6366f1"/>
    <rect x="-9" y="14" width="18" height="10" rx="2" fill="#4f46e5"/>
    <!-- Back arm -->
    <line x1="13" y1="14" x2="26" y2="24" stroke="#d4a874" stroke-width="7" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="0" cy="-2" r="12" fill="#d4a874"/>
    <ellipse cx="-4" cy="-5" rx="2" ry="2.5" fill="#1a1008"/>
    <ellipse cx="5" cy="-5" rx="2" ry="2.5" fill="#1a1008"/>
    <path d="M-3 2 Q1 4 5 2" stroke="#b08a64" stroke-width="1.2" fill="none"/>
    <!-- Flashlight arm -->
    <line x1="-13" y1="12" x2="-32" y2="4" stroke="#d4a874" stroke-width="7" stroke-linecap="round"/>
    <!-- Flashlight -->
    <rect x="-44" y="-2" width="16" height="8" rx="2" fill="#555" stroke="#777" stroke-width="1"/>
    <circle cx="-44" cy="2" r="4" fill="#fde68a" filter="url(#psglow)"/>
  </g>
  <!-- Flashlight beam -->
  <polygon points="516,172 330,180 330,220 516,176" fill="url(#pflash)" opacity="0.6"/>
  <line x1="516" y1="174" x2="340" y2="195" stroke="#fde68a" stroke-width="0.5" opacity="0.2"/>
  <line x1="516" y1="174" x2="340" y2="205" stroke="#fde68a" stroke-width="0.5" opacity="0.15"/>
  <!-- Lamp on table -->
  <g transform="translate(210 170)">
    <rect x="-3" y="0" width="6" height="20" rx="1" fill="#b8a080"/>
    <ellipse cx="0" cy="0" rx="10" ry="8" fill="#f2c14e" opacity="0.25"/>
    <ellipse cx="0" cy="-2" rx="8" ry="6" fill="#fde68a" opacity="0.4"/>
    <circle cx="0" cy="0" r="3" fill="#fbbf24" filter="url(#psglow)"/>
  </g>
  <!-- Vase on floor -->
  <g transform="translate(270 220)">
    <ellipse cx="0" cy="14" rx="10" ry="2" fill="#000" opacity="0.15"/>
    <path d="M-8 0 Q-10 -14 -5 -20 Q0 -24 5 -20 Q10 -14 8 0 Q6 6 6 12 Q0 14 -6 12 Q-6 6 -8 0Z" fill="#4a7a9a"/>
    <path d="M-5 -20 Q0 -22 5 -20" stroke="#5a8aaa" stroke-width="1" fill="none"/>
  </g>
  <!-- SEEKER badge -->
  <rect x="530" y="130" width="80" height="24" rx="6" fill="#6366f1" opacity="0.9"/>
  <text x="570" y="147" text-anchor="middle" font-size="11" font-weight="900" fill="#fff" font-family="Arial,sans-serif" letter-spacing="2">SEEKER</text>
  <!-- HIDER badge near barrel -->
  <rect x="295" y="150" width="70" height="20" rx="5" fill="#22c55e" opacity="0.8"/>
  <text x="330" y="164" text-anchor="middle" font-size="9" font-weight="900" fill="#fff" font-family="Arial,sans-serif" letter-spacing="2">HIDER</text>
  <!-- Title -->
  <g font-family="'Arial Black','Segoe UI Black',Impact,sans-serif" font-weight="900" text-anchor="middle">
    <text x="333" y="58" font-size="62" letter-spacing="5" fill="#000" opacity="0.4">PROP HUNT</text>
    <text x="330" y="55" font-size="62" letter-spacing="5" fill="#a78bfa" filter="url(#psglow)">PROP HUNT</text>
    <text x="330" y="78" font-size="13" letter-spacing="7" fill="#c4b5fd" opacity="0.85">HIDE IN PLAIN SIGHT</text>
  </g>
  <!-- Vignette -->
  <radialGradient id="pvig" cx="50%" cy="50%" r="70%">
    <stop offset="55%" stop-color="transparent"/>
    <stop offset="100%" stop-color="rgba(0,0,0,0.6)"/>
  </radialGradient>
  <rect width="660" height="300" fill="url(#pvig)"/>
</svg>
